<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOE Connect — Business Profile</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0E0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --matte-black:#0E0E0C; --charcoal:#242220; --white:#FBFAF7;
    --gold:#C9A227; --gold-light:#E8C468; --line-dark:rgba(14,14,12,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Jost',sans-serif;background:var(--white);color:var(--matte-black);line-height:1.6;}
  h1,h2,h3,.wordmark{font-family:'Fraunces',serif;}
  a{color:inherit;}

  header{background:var(--matte-black);color:var(--white);padding:22px 48px;display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-size:22px;font-weight:500;}
  .wordmark span{color:var(--gold-light);}
  header nav a{font-size:14px;color:rgba(251,250,247,0.78);text-decoration:none;}

  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 80px;}
  .back-link{font-size:13px;color:#7a776f;text-decoration:none;display:inline-block;margin-bottom:24px;}
  .back-link:hover{color:var(--gold);}

  .video-embed{width:100%;aspect-ratio:16/9;border:none;margin-bottom:28px;background:var(--charcoal);}
  .video-embed.tall{aspect-ratio:auto;width:100%;max-width:380px;height:640px;display:block;margin-left:auto;margin-right:auto;}
  .video-social{border:1px solid var(--line-dark);background:#fff;border-radius:4px;padding:22px;margin-bottom:28px;text-align:center;}
  .video-social .vs-title{font-family:'Fraunces',serif;font-size:18px;margin-bottom:12px;}
  .video-social .vs-play{display:inline-block;background:var(--gold);color:var(--matte-black);border:none;border-radius:2px;padding:11px 20px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;}
  .video-social .vs-play:hover{background:var(--gold-light);}
  .video-social .vs-open{display:inline-block;margin-left:14px;font-size:14px;color:#5c5a54;text-decoration:underline;}
  .video-social .vs-note{font-size:12px;color:#7a776f;margin-top:12px;}

  .profile-tag{font-size:13px;color:var(--gold);font-weight:500;margin-bottom:8px;}
  h1.profile-name{font-size:32px;font-weight:500;margin-bottom:8px;}
  .profile-loc{font-size:15px;color:#7a776f;margin-bottom:20px;}

  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:12px;}

  .profile-desc{font-size:16px;color:#3a3833;margin-bottom:28px;}
  .profile-bio{font-size:15px;color:#3a3833;margin-bottom:28px;padding-top:20px;border-top:1px solid #E4E1D8;}

  .contact-box{border:1px solid #E4E1D8;padding:20px 24px;background:#F6F4EC;}
  .contact-box a{
    display:inline-block;background:var(--matte-black);color:var(--white);
    padding:12px 26px;font-size:14px;font-weight:500;border-radius:2px;text-decoration:none;
    transition:background .18s ease;
  }
  .contact-box a:hover{background:var(--charcoal);}
  .contact-box a.book-btn{background:var(--gold);color:var(--matte-black);margin:0 10px 10px 0;}
  .contact-box a.book-btn:hover{background:var(--gold-light);}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .info-grid.single{grid-template-columns:1fr;}
  .info-box{border:1px solid #E4E1D8;padding:20px 24px;}
  .info-title{font-family:'Fraunces',serif;font-size:17px;font-weight:500;margin-bottom:10px;}
  .info-box a.directions{display:inline-block;margin-top:10px;font-size:13px;color:var(--gold);text-decoration:underline;}
  table.hours{width:100%;font-size:14px;border-collapse:collapse;}
  table.hours td{padding:6px 0;border-bottom:1px solid #F0EDE4;}
  table.hours td:last-child{text-align:right;}
  table.hours tr:last-child td{border-bottom:none;}
  table.hours tr.today{font-weight:500;color:#8A6A0E;}
  @media(max-width:700px){.info-grid{grid-template-columns:1fr;}}

  footer{background:var(--matte-black);color:rgba(251,250,247,0.6);padding:40px 48px;font-size:13px;text-align:center;}
  footer a{text-decoration:none;}
  .profile-bio{white-space:pre-line;}
  footer a:hover{color:var(--gold-light);}

  @media(max-width:860px){
    header,.wrap,footer{padding-left:22px;padding-right:22px;}
  }
</style>
</head>
<body>

<header>
  <div class="wordmark" style="display:flex;align-items:center;gap:10px;">
    <svg width="30" height="30" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <rect width="128" height="128" rx="20" fill="#0E0E0C"/>
      <rect x="10" y="10" width="108" height="108" rx="12" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.6"/>
      <text x="64" y="88" font-family="Fraunces, serif" font-size="64" font-weight="600" fill="#E8C468" text-anchor="middle">T</text>
    </svg>
    <span>TOE <span style="color:#E8C468;">Connect</span></span>
  </div>
  <nav><a href="index.html">← Back to directory</a></nav>
</header>

<div class="wrap" id="content">
  <p style="font-size:14px;color:#7a776f;">Loading profile…</p>
</div>

<footer>
  <a href="index.html">TOE Connect</a> — a directory by Time of Essence Global Group, LLC
  <div style="margin-top:10px;">Questions? <a href="mailto:toeconnect4@gmail.com" style="text-decoration:underline;">toeconnect4@gmail.com</a> · <a href="tel:4143480307" style="text-decoration:underline;">414-348-0307</a></div>
  <div style="margin-top:10px;"><a href="about.html" style="text-decoration:underline;">About</a> · <a href="faq.html" style="text-decoration:underline;">FAQ</a> · <a href="contact.html" style="text-decoration:underline;">Contact</a> · <a href="privacy.html" style="text-decoration:underline;">Privacy Policy</a> · <a href="terms.html" style="text-decoration:underline;">Terms of Use</a></div>
</footer>

<script>
  // Works out how to show a video link. Returns { kind, embed, link, label } or null.
  //  kind 'direct'  = YouTube/Vimeo, plays straight away
  //  kind 'social'  = TikTok/Instagram/Facebook, plays only after a click (loads content from that company)
  //  kind 'link'    = any other https link, shown as a "Watch video" button
  function parseVideo(url) {
    let u;
    try { u = new URL(String(url || '').trim()); } catch (e) { return null; }
    if (u.protocol !== 'https:') return null;
    const host = u.hostname.toLowerCase().replace(/^(www\.|m\.|web\.|mobile\.)/, '');
    const path = u.pathname;
    const link = u.href;

    if (host === 'youtube.com' || host === 'youtu.be') {
      let id = null, m;
      if (host === 'youtu.be') { m = path.match(/^\/([\w-]{11})/); id = m && m[1]; }
      else if ((m = path.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/))) id = m[1];
      else if (path === '/watch') { const v = u.searchParams.get('v'); if (v && /^[\w-]{11}$/.test(v)) id = v; }
      if (id) return { kind: 'direct', embed: `https://www.youtube.com/embed/${id}`, link, label: 'YouTube', ratio: 'wide' };
    }
    if (host === 'vimeo.com') {
      const m = path.match(/^\/(?:\w+\/)*(\d{6,})/);
      if (m) return { kind: 'direct', embed: `https://player.vimeo.com/video/${m[1]}`, link, label: 'Vimeo', ratio: 'wide' };
    }
    if (host === 'tiktok.com') {
      const m = path.match(/^\/@[\w.\-]+\/video\/(\d{8,25})/);
      if (m) return { kind: 'social', embed: `https://www.tiktok.com/embed/v2/${m[1]}`, link, label: 'TikTok', ratio: 'tall' };
    }
    if (host === 'instagram.com') {
      const m = path.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]{5,})/);
      if (m) return { kind: 'social', embed: `https://www.instagram.com/${m[1] === 'reels' ? 'reel' : m[1]}/${m[2]}/embed`, link, label: 'Instagram', ratio: 'tall' };
    }
    if (host === 'facebook.com' || host === 'fb.watch') {
      const isVideo = host === 'fb.watch' || /\/(videos|reel)\/\d+/.test(path) || (path.replace(/\/$/, '') === '/watch' && /^\d+$/.test(u.searchParams.get('v') || ''));
      if (isVideo) return { kind: 'social', embed: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(link)}&show_text=false`, link, label: 'Facebook', ratio: 'wide' };
    }
    const label = host.replace(/^www\./, '');
    return { kind: 'link', embed: '', link, label };
  }

  function videoHtml(b) {
    const v = parseVideo(b.videoUrl);
    if (!v) return '';
    if (v.kind === 'direct') {
      return `<iframe class="video-embed" src="${esc(v.embed)}" title="${esc(b.name)} video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }
    if (v.kind === 'social') {
      return `<div class="video-social ${v.ratio}" data-embed="${esc(v.embed)}" data-title="${esc(b.name)} video">
        <p class="vs-title">Video on ${esc(v.label)}</p>
        <button type="button" class="vs-play">Play video</button>
        <a class="vs-open" href="${esc(v.link)}" target="_blank" rel="noopener noreferrer">Open on ${esc(v.label)} ↗</a>
        <p class="vs-note">Playing this video loads content from ${esc(v.label)}.</p>
      </div>`;
    }
    return `<div class="video-social link"><a class="vs-play" href="${esc(v.link)}" target="_blank" rel="noopener noreferrer">Watch their video ↗</a></div>`;
  }

  // Social videos (TikTok, Instagram, Facebook) load only after the visitor clicks Play.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.vs-play');
    if (!btn || btn.tagName !== 'BUTTON') return;
    const box = btn.closest('.video-social');
    const src = box && box.getAttribute('data-embed');
    if (!src || !/^https:\/\/(www\.tiktok\.com|www\.instagram\.com|www\.facebook\.com)\//.test(src)) return;
    const frame = document.createElement('iframe');
    frame.className = 'video-embed ' + (box.classList.contains('tall') ? 'tall' : 'wide');
    frame.src = src;
    frame.title = box.getAttribute('data-title') || 'Video';
    frame.setAttribute('allow', 'encrypted-media; picture-in-picture; fullscreen');
    frame.setAttribute('allowfullscreen', '');
    box.replaceWith(frame);
  });

  // Sample data — shown automatically if no ?id= is given, or if the real fetch fails.
  // This lets you preview exactly how a profile page looks without needing a live listing yet.
  const DEMO = {
    name: 'Root & Bloom Studio',
    category: 'Beauty & wellness',
    city: 'Wauwatosa',
    address: '1234 W Main St, Wauwatosa, WI 53213',
    homeBased: false,
    hoursType: 'Set hours',
    hours: [
      { day: 'Monday', hours: 'Closed' }, { day: 'Tuesday', hours: '10:00 AM - 6:00 PM' },
      { day: 'Wednesday', hours: '10:00 AM - 6:00 PM' }, { day: 'Thursday', hours: '10:00 AM - 7:00 PM' },
      { day: 'Friday', hours: '10:00 AM - 7:00 PM' }, { day: 'Saturday', hours: '9:00 AM - 3:00 PM' },
      { day: 'Sunday', hours: 'Closed' }
    ],
    description: 'Natural hair care and scalp treatments by appointment.',
    fullBio: 'Root & Bloom Studio has been serving the Wauwatosa community for three years, specializing in natural hair care, scalp health treatments, and protective styling. Every appointment starts with a consultation to build a plan around your hair\'s specific needs.',
    website: 'https://example.com',
    bookingUrl: 'https://example.com/book',
    phone: '(414) 555-0100',
    email: '',
    videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
    logoUrl: '',
    servesRemotely: false,
    mobileService: false,
    inPersonService: true,
    supporter: true,
    womenOwned: true,
    businessVerified: true,
    licenseVerified: false,
    ownershipReviewed: true,
    mbeCertified: false
  };

  // Splits "(414) 348-0307 ext. 2" or "414-348-0307 x2" into the main number and extension.
  function splitPhone(p) {
    const raw = String(p || '').trim();
    const i = raw.search(/ext(?:ension)?\.?|[x#,]/i);
    const mainPart = i >= 0 ? raw.slice(0, i) : raw;
    const ext = i >= 0 ? raw.slice(i).replace(/\D/g, '') : '';
    let d = mainPart.replace(/\D/g, '');
    if (d.length === 11 && d[0] === '1') d = d.slice(1);
    return { raw, main: d.length === 10 ? d : '', ext };
  }
  // 4143480307 -> (414) 348-0307, and with an extension -> (414) 348-0307 ext. 2. Anything else is shown as typed.
  function formatPhone(p) {
    const s = splitPhone(p);
    if (!s.main) return s.raw;
    const base = `(${s.main.slice(0,3)}) ${s.main.slice(3,6)}-${s.main.slice(6)}`;
    return s.ext ? `${base} ext. ${s.ext}` : base;
  }
  // What goes in the tap-to-call link. A comma makes the phone pause, then dial the extension.
  const phoneDigits = (p) => {
    const s = splitPhone(p);
    return s.main ? s.main + (s.ext ? ',' + s.ext : '') : String(p || '').replace(/[^\d+]/g, '');
  };

  // Only real web links are allowed; "www.site.com" gets https:// added. Anything else is dropped.
  function safeHref(u) {
    const s = String(u || '').trim();
    if (/^https?:\/\/\S+$/i.test(s)) return s;
    if (/^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(s)) return 'https://' + s;
    return '';
  }

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function render(b) {
    const content = document.getElementById('content');

    const videoHTML = videoHtml(b);

    const modeTags = [];
    if (b.inPersonService) modeTags.push('in-person');
    if (b.servesRemotely) modeTags.push('also serves clients virtually');
    if (b.mobileService) modeTags.push('mobile / traveling business');
    const cityOnly = String(b.city || '').replace(/,?\s*(WI|Wisconsin)\.?$/i, '').trim();
    const place = cityOnly ? `${cityOnly}, WI` : '';
    const locLine = modeTags.length ? `${place} · ${modeTags.join(' · ')}` : place;

    // Location box: public address (with directions), or a home-based note.
    let locationBox = '';
    if (b.address) {
      const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address);
      locationBox = `<div class="info-box"><div class="info-title">Location</div><div style="font-size:14px;">📍 ${esc(b.address)}</div><a class="directions" href="${mapUrl}" target="_blank" rel="noopener">Get directions →</a></div>`;
    } else if (b.homeBased) {
      locationBox = `<div class="info-box"><div class="info-title">Location</div><div style="font-size:14px;">🏠 Home-based business — address kept private. Contact them to arrange a visit.</div></div>`;
    }

    // Hours box: weekly table (today highlighted) or "By appointment". Nothing is shown if hours weren't listed.
    let hoursBox = '';
    if (b.hoursType === 'By appointment') {
      hoursBox = `<div class="info-box"><div class="info-title">Hours</div><div style="font-size:14px;">By appointment only. Contact them to schedule.</div></div>`;
    } else if (b.hoursType === 'Set hours' && b.hours && b.hours.length) {
      const today = new Date().toLocaleDateString('en-US', { weekday: 'long', timeZone: 'America/Chicago' });
      const rows = b.hours.map(h => `<tr class="${h.day === today ? 'today' : ''}"><td>${esc(h.day)}</td><td>${esc(h.hours)}</td></tr>`).join('');
      hoursBox = `<div class="info-box"><div class="info-title">Hours</div><table class="hours">${rows}</table></div>`;
    }
    const infoGrid = (locationBox || hoursBox)
      ? `<div class="info-grid${locationBox && hoursBox ? '' : ' single'}">${locationBox}${hoursBox}</div>`
      : '';

    const badgeDefs = [
      [b.businessVerified, '✓ Business Verified', '#EFF6EC', '#2F6B3A'],
      [b.licenseVerified, '✓ License Verified', '#EFF6EC', '#2F6B3A'],
      [b.ownershipReviewed, '✓ Black-Owned — Attested & Reviewed', '#EFF6EC', '#2F6B3A'],
      [b.mbeCertified, '🏆 WI MBE Certified', '#FBF3DC', '#8A6A0E'],
      [b.womenOwned, 'Women-owned', '#FBF3DC', '#8A6A0E'],
      [b.supporter, 'Supporter', '#F1EEF9', '#5B4A9E']
    ];
    const badgesHTML = badgeDefs
      .filter(([show]) => show)
      .map(([, label, bg, color]) => `<span class="badge" style="background:${bg};color:${color};">${label}</span>`)
      .join('');

    const bioHTML = b.fullBio ? `<div class="profile-bio">${esc(b.fullBio)}</div>` : '';
    const siteHref = safeHref(b.website);
    const websiteHTML = siteHref
      ? `<a href="${esc(siteHref)}" target="_blank" rel="noopener">Visit website →</a>`
      : `<span style="color:#8a8780;">No website listed yet</span>`;
    const bookingHTML = (b.bookingUrl && /^https:\/\//i.test(b.bookingUrl))
      ? `<a class="book-btn" href="${esc(b.bookingUrl)}" target="_blank" rel="noopener">Book now →</a>`
      : '';
    const phoneHTML = b.phone
      ? `<div style="margin-top:12px;font-size:14px;color:var(--matte-black);">📞 <a href="tel:${esc(phoneDigits(b.phone))}" style="text-decoration:underline;">${esc(formatPhone(b.phone))}</a></div>`
      : '';
    const emailHTML = b.email
      ? `<div style="margin-top:8px;font-size:14px;color:var(--matte-black);">✉ <a href="mailto:${esc(b.email)}" style="text-decoration:underline;">${esc(b.email)}</a></div>`
      : '';

    const logoHTML = b.logoUrl
      ? `<img src="${esc(b.logoUrl)}" alt="${esc(b.name)} logo" style="width:96px;height:96px;object-fit:cover;border-radius:8px;margin-bottom:20px;border:1px solid #E4E1D8;">`
      : '';

    content.innerHTML = `
      <a href="index.html" class="back-link">← Back to directory</a>
      ${logoHTML}
      ${videoHTML}
      <div class="profile-tag">${esc(b.category)}</div>
      <h1 class="profile-name">${esc(b.name)}</h1>
      <div class="profile-loc">${esc(locLine)}</div>
      <div class="badge-row">${badgesHTML}</div>
      <div class="profile-desc">${esc(b.description)}</div>
      ${bioHTML}
      ${infoGrid}
      <div class="contact-box">
        ${bookingHTML}
        ${websiteHTML}
        ${phoneHTML}
        ${emailHTML}
      </div>
    `;
  }

  async function loadProfile() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      render(DEMO); // No id given — show the demo so this page can be previewed directly.
      return;
    }

    try {
      const res = await fetch(`/.netlify/functions/get-business?id=${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      render(data.business);
    } catch (err) {
      document.getElementById('content').innerHTML = '<p style="font-size:14px;color:#7a776f;">This listing couldn\'t be found. <a href="index.html">Back to directory</a></p>';
    }
  }

  loadProfile();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    });
  }
</script>

</body>
</html>
